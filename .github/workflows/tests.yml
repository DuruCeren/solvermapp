name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy and gfortran
        run: |
          python -m pip install --upgrade pip numpy
          sudo apt-get update && sudo apt-get install -y gfortran

      - name: Run tests (Chrome is preinstalled on GitHub's Ubuntu runners; MATLAB is skipped)
        run: python tests/run_all.py --no-matlab
