name: Bug report
description: Something works wrongly, or an equation is read wrongly.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        I typed  f = 64/Re  and the card found ... but I expected ...
    validations:
      required: true
  - type: textarea
    id: equation
    attributes:
      label: The equation(s)
      description: As you typed them (plain math or LaTeX).
      render: latex
  - type: textarea
    id: project
    attributes:
      label: Project file
      description: File → Export project, then drag the .json file here. It reproduces the problem exactly.
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Equation card / detection
        - Variables / values
        - Plan / graph
        - Flowchart
        - Code (Python)
        - Code (MATLAB)
        - Code (Fortran)
        - Report (LaTeX)
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
